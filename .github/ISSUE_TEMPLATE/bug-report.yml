name: Bug report
description: A plugin, the catalogue or the tooling misbehaves.
title: "Bug: "
labels: ["bug"]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin (or "tooling" / "catalogue")
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and channel
      placeholder: "1.0.0 on agent-marketplace-stable"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
