version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    # One PR for all action pin bumps (SHA + version comment), not one per action.
    groups:
      actions:
        patterns: ["*"]
  # The Claude Code CLI that CI runs, pinned by hash in .github/claude-code/package-lock.json.
  - package-ecosystem: npm
    directory: /.github/claude-code
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      claude-code:
        patterns: ["@anthropic-ai/*"]
