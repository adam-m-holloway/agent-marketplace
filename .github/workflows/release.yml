# On every push to main: run the script tests, then tag + release each plugin version that has
# no `<name>--v<version>` tag yet (scripts/release.mjs). Idempotent: a no-bump merge tags nothing.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: 2.1.319

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Credentials are kept so `claude plugin tag --push` can push tags; no artifacts are uploaded.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Script tests (a failure stops the release)
        run: npm test
      - name: Install Claude Code CLI (pinned)
        env:
          DISABLE_AUTOUPDATER: 1
        # Exact pinned version (a global CLI has no lockfile); one retry.
        run: | # zizmor: ignore[adhoc-packages]
          install() { npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"; }
          install || { sleep 10; install; }
          claude --version
      - name: Tag and release new plugin versions
        env:
          GH_TOKEN: ${{ github.token }}
          DISABLE_AUTOUPDATER: 1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs
