name: insights

# Nightly usage insights: reads each consumer repo's committed .claude/settings.json and writes
# a snapshot to the orphan `data` branch. Committed intent per repo, not what each laptop has
# installed. Never writes to main.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: insights
  cancel-in-progress: false

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push to the data branch only
      actions: write # dispatch pages.yml
      issues: write # behind issues + the pinned daily report issue
    steps:
      - name: Check out default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Does the data branch exist?
        id: data
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if git -c "http.https://github.com/.extraheader=$auth" ls-remote --exit-code --heads "https://github.com/${REPO}.git" data; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out data branch
        if: steps.data.outputs.exists == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: data
          path: data
          persist-credentials: false

      - name: Create orphan data branch (first run only)
        if: steps.data.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git init -b data data
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://github.com/${REPO}.git"
          git commit --allow-empty -m "chore(insights): initialise data branch"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" push origin HEAD:data

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Scan consumers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/insights/run.mjs --data data

      - name: Commit and push snapshot to data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(insights): snapshot $(date -u +%F)"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" push origin HEAD:data
          echo "Last successful insights run: $(date -u +%F)" >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run pages.yml --repo "$REPO" --ref "$DEFAULT_BRANCH"

      - name: Update behind issues and the daily report issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/insights/issues.mjs --data data
