name: scorecard

# OpenSSF Scorecard: scores this repo's supply-chain practices (pinned actions, token
# permissions, branch protection, code review, dangerous workflows, ...) and publishes the result
# to the public Scorecard API (viewer: https://scorecard.dev/viewer/?uri=github.com/adam-m-holloway/agent-marketplace).
# No SARIF upload (no code scanning / GHAS in scope); the JSON result is kept as a workflow artifact.
# publish_results imposes rules on this file: no top-level env/defaults, no write permissions at
# the workflow level, and only allow-listed actions in the job (checkout, scorecard, upload-artifact).
on:
  push:
    branches: [main]
  schedule:
    - cron: '27 6 * * 1' # weekly, Monday 06:27 UTC
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # read the repo
      actions: read # read workflow runs for the CI-Tests / Dangerous-Workflow checks
      id-token: write # OIDC token to publish results to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.json
          retention-days: 30
