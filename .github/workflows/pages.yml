name: pages

# Publishes the catalogue site. Always built from main's content; a push to stable only
# refreshes the stable version badges. The data branch (insights) is read if it exists.
on:
  push:
    branches: [main, stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  UV_VERSION: 0.13.7
  SKILLSPECTOR_REF: v2.11.2
  # Quality tools (npm ones are pinned in scripts/quality-tools.sh).
  DART_SDK: 3.13.0
  SKILLSCORE_VERSION: 0.10.0
  LYCHEE_VERSION: 0.24.2
  LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # + Playwright install and browser checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch stable and data branches (either may not exist yet)
        run: |
          for b in stable data; do
            git fetch --no-tags origin "+refs/heads/$b:refs/remotes/origin/$b" \
              || echo "::notice::branch $b not found; site shows it as missing"
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24

      # Optional: SkillSpector risk feeds the security score. Installed exactly like pr-gate (pinned
      # tag, --no-llm, no cache). If any of this fails, the site still builds and shows
      # "SkillSpector: not run".
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        continue-on-error: true
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: SkillSpector --no-llm (optional; writes skillspector.json)
        continue-on-error: true
        run: |
          set -uo pipefail
          uv tool install "git+https://github.com/NVIDIA/skillspector.git@${SKILLSPECTOR_REF}" \
            || { sleep 10; uv tool install "git+https://github.com/NVIDIA/skillspector.git@${SKILLSPECTOR_REF}"; } || exit 1
          out="$RUNNER_TEMP/skillspector"
          mkdir -p "$out"
          for dir in plugins/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            args=(scan "$dir" --no-llm --format json --output "$out/$name.json")
            if [ -f "$dir.skillspector-baseline.yaml" ]; then args+=(--baseline "$dir.skillspector-baseline.yaml"); fi
            # A high risk exits non-zero but still writes the report; the score shows it.
            skillspector "${args[@]}" || echo "::notice::skillspector exited non-zero for $name"
          done
          node scripts/scores.mjs --collect-skillspector "$out" > skillspector.json
          cat skillspector.json

      # Optional: static quality tools (skill-check, skillscore, markdownlint-cli2, lychee, cspell)
      # feed the quality score. Pinned versions, no cache. Any tool that fails is shown as "not run".
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        continue-on-error: true
        with:
          sdk: ${{ env.DART_SDK }}
      - name: Quality tools (optional; writes quality reports)
        continue-on-error: true
        run: |
          set -uo pipefail
          dart pub global activate skillscore "${SKILLSCORE_VERSION}" \
            && export PATH="$HOME/.pub-cache/bin:$PATH" \
            || echo "::notice::skillscore install failed; shown as not run"
          url="https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin"
          if curl -fsSL --retry 1 -o "$RUNNER_TEMP/lychee.tgz" "$url" \
             && echo "${LYCHEE_SHA256}  $RUNNER_TEMP/lychee.tgz" | sha256sum -c -; then
            tar -xzf "$RUNNER_TEMP/lychee.tgz" -C "$RUNNER_TEMP/bin" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
            export PATH="$RUNNER_TEMP/bin:$PATH"
          else
            echo "::notice::lychee download failed; shown as not run"
          fi
          bash scripts/quality-tools.sh "$RUNNER_TEMP/quality"

      - name: Build site
        run: |
          args=(--out _site)
          if [ -s skillspector.json ] && [ "$(tr -d ' \n' < skillspector.json)" != "{}" ]; then args+=(--skillspector skillspector.json); fi
          if [ -d "$RUNNER_TEMP/quality" ]; then args+=(--quality "$RUNNER_TEMP/quality"); fi
          node scripts/build-site.mjs "${args[@]}"

      # Browser checks (Playwright, chromium, light + dark) against _site served on 127.0.0.1 by
      # python3 -m http.server (see .github/playwright/playwright.config.mjs). A failure stops the
      # job before the artifact upload, so nothing is deployed.
      - name: Install Playwright + chromium (pinned by lockfile)
        working-directory: .github/playwright
        # `npm ci` verifies every package against .github/playwright/package-lock.json. One retry.
        run: |
          install() { npm ci --no-audit --no-fund && npx playwright install --with-deps chromium; }
          install || { sleep 10; install; }
      - name: Browser checks
        working-directory: .github/playwright
        run: npx playwright test

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # deploy the artifact
      id-token: write # OIDC token required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
